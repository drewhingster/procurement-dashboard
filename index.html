<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOS Procurement Tracking System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Blue & White Professional Theme */
            --primary: #1e40af;        /* Deep Blue */
            --primary-light: #3b82f6;  /* Bright Blue */
            --primary-dark: #1e3a8a;   /* Navy Blue */
            --secondary: #f8fafc;      /* White/Off-white */
            --bg-dark: #f1f5f9;        /* Light Gray background */
            --bg-card: #ffffff;        /* Pure White cards */
            --bg-card-hover: #f1f5f9;
            --text-primary: #0f172a;   /* Near-black for readability */
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border: #cbd5e1;         /* Defined borders for visibility */
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-light);
            position: sticky;
            top: 0;
            z-index: 100;
            color: white;
        }

        .logo-section { display: flex; align-items: center; gap: 1rem; }
        .logo {
            width: 50px; height: 50px;
            background: white;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.25rem;
            color: var(--primary-dark);
        }

        .header-title h1 { font-size: 1.4rem; font-weight: 700; }
        .header-title span { font-size: 0.85rem; opacity: 0.9; }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
        }

        .btn-primary { background: white; color: var(--primary-dark); }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .main-container { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 85px); }

        .sidebar { background: white; border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar-section { background: var(--bg-dark); border-radius: 8px; padding: 1rem; border: 1px solid var(--border); }
        .sidebar-section h3 { font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.75rem; letter-spacing: 0.05em; font-weight: 800; }

        .stat-item { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); }
        .stat-value { font-weight: 700; color: var(--primary-dark); }

        .total-amount { text-align: center; padding: 1rem; background: var(--primary-dark); border-radius: 6px; margin-top: 0.5rem; color: white; }
        .total-amount .value { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 700; color: #60a5fa; }

        .filter-group { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.8rem; }
        .filter-group label { font-size: 0.7rem; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; }
        .filter-group select, .filter-group input { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }

        .content { padding: 1.5rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .tab { padding: 0.6rem 1.2rem; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        .table-container { background: white; border-radius: 8px; border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
        .table-toolbar { padding: 1rem; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); background: #f8fafc; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { 
            background: #f1f5f9; 
            padding: 1rem; 
            text-align: left; 
            font-weight: 800; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            color: var(--text-primary); 
            border-bottom: 2px solid var(--border);
            cursor: pointer;
        }
        th:hover { background: #e2e8f0; }
        td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); color: var(--text-primary); }
        tr:hover td { background: var(--bg-card-hover); }

        .status-badge { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
        .status-completed { background: #dcfce7; color: #166534; }
        .status-pending { background: #fef3c7; color: #92400e; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal { background: white; width: 90%; max-width: 800px; border-radius: 12px; overflow: hidden; }
        .modal-header { padding: 1.5rem; background: var(--bg-dark); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 1.5rem; max-height: 70vh; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .full-width { grid-column: span 2; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 0.3rem; color: var(--text-secondary); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 4px; }
        .modal-footer { padding: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.5rem; }

        .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 2000; }
        .toast { background: var(--text-primary); color: white; padding: 0.8rem 1.5rem; border-radius: 6px; box-shadow: var(--shadow); margin-top: 0.5rem; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-section">
            <div class="logo">BOS</div>
            <div class="header-title">
                <h1>Procurement Tracking System</h1>
                <span>Bureau of Statistics - Procurement Unit</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="showImportModal()">📥 Import Excel</button>
            <button class="btn btn-primary" onclick="showAddModal()">➕ New Transaction</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>📊 Overview</h3>
                <div class="stat-grid">
                    <div class="stat-item"><span class="stat-label">Total</span><span class="stat-value" id="stat-total">0</span></div>
                    <div class="stat-item"><span class="stat-label">Pending</span><span class="stat-value" id="stat-pending">0</span></div>
                    <div class="stat-item"><span class="stat-label">Paid</span><span class="stat-value" id="stat-paid">0</span></div>
                </div>
                <div class="total-amount">
                    <div style="font-size: 0.65rem; text-transform: uppercase; font-weight: 800;">Total Spend</div>
                    <div class="value" id="stat-amount">$0</div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>🔍 Filters</h3>
                <div class="filter-group">
                    <label>Status</label>
                    <select id="filter-status" onchange="updateTable()">
                        <option value="">All Status</option>
                        <option value="Pending Approval">Pending Approval</option>
                        <option value="Approved">Approved</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Payment</label>
                    <select id="filter-payment" onchange="updateTable()">
                        <option value="">All</option>
                        <option value="paid">Paid</option>
                        <option value="unpaid">Unpaid</option>
                    </select>
                </div>
                <button class="btn" style="width: 100%; margin-top: 1rem; background: #e2e8f0;" onclick="clearFilters()">Reset Filters</button>
            </div>
        </aside>

        <main class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('all', this)">All Transactions</button>
                <button class="tab" onclick="switchTab('pending', this)">Pending (Unpaid)</button>
                <button class="tab" onclick="switchTab('completed', this)">Completed (Paid)</button>
            </div>

            <div class="table-container">
                <div class="table-toolbar">
                    <input type="text" id="search-input" placeholder="Search..." onkeyup="updateTable()" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; width: 250px;">
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Details</th>
                                <th>Supplier</th>
                                <th>Amount (GYD)</th>
                                <th onclick="sortTransactions('rfqDate')" style="cursor: pointer;">RFQ Date ↕</th>
                                <th onclick="sortTransactions('closeDate')" style="cursor: pointer;">Close Date ↕</th>
                                <th>Approval</th>
                                <th>Paid</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="transaction-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">New Transaction</h2>
                <button onclick="closeModal('transaction-modal')" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <form id="transaction-form" class="form-grid">
                    <input type="hidden" id="edit-id">
                    <div class="form-group full-width"><label>Details</label><input type="text" id="details" required></div>
                    <div class="form-group"><label>Supplier</label><input type="text" id="supplier" required></div>
                    <div class="form-group"><label>Amount (GYD)</label><input type="number" id="amount" required></div>
                    <div class="form-group"><label>RFQ Date</label><input type="date" id="rfq-date"></div>
                    <div class="form-group"><label>Close Date</label><input type="date" id="close-date"></div>
                    <div class="form-group">
                        <label>Approval Status</label>
                        <select id="approval-status">
                            <option value="Pending Approval">Pending Approval</option>
                            <option value="Approved">Approved</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Approval #</label><input type="text" id="mtb-number"></div>
                    <div class="form-group">
                        <label>Payment Made</label>
                        <select id="payment-made">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" style="background: #e2e8f0;" onclick="closeModal('transaction-modal')">Cancel</button>
                <button class="btn btn-primary" style="background: var(--primary); color: white;" onclick="saveTransaction()">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="import-modal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header"><h2>Import Excel</h2></div>
            <div class="modal-body">
                <input type="file" id="excel-input" accept=".xlsx,.xls" onchange="handleFileSelect(event)">
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        let transactions = [];
        let currentTab = 'all';
        let sortDir = 1;

        loadFromLocalStorage();

        function saveToLocalStorage() { localStorage.setItem('bos_procurement_data', JSON.stringify(transactions)); }
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('bos_procurement_data');
            if (saved) transactions = JSON.parse(saved);
            updateTable();
        }

        function sortTransactions(col) {
            sortDir *= -1;
            transactions.sort((a, b) => {
                const valA = a[col] || '';
                const valB = b[col] || '';
                return valA < valB ? -sortDir : (valA > valB ? sortDir : 0);
            });
            updateTable();
        }

        function updateTable() {
            const tbody = document.getElementById('table-body');
            const search = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const paymentFilter = document.getElementById('filter-payment').value;

            const filtered = transactions.filter(txn => {
                const matchesSearch = (txn.details + txn.supplier).toLowerCase().includes(search);
                const matchesStatus = !statusFilter || txn.approvalStatus === statusFilter;
                const matchesPayment = !paymentFilter || (paymentFilter === 'paid' ? txn.paymentMade : !txn.paymentMade);
                
                // USER LOGIC: Remain in "Pending" tab if not paid
                const matchesTab = currentTab === 'all' || 
                    (currentTab === 'pending' && !txn.paymentMade) || 
                    (currentTab === 'completed' && txn.paymentMade);

                return matchesSearch && matchesStatus && matchesPayment && matchesTab;
            });

            tbody.innerHTML = filtered.map(txn => `
                <tr>
                    <td><div style="font-weight:700">${txn.details || '-'}</div></td>
                    <td><span style="color:var(--primary); font-weight:600">${txn.supplier || '-'}</span></td>
                    <td style="font-family:monospace; font-weight:700">$${(Number(txn.amount)||0).toLocaleString()}</td>
                    <td>${txn.rfqDate || '-'}</td>
                    <td>${txn.closeDate || '-'}</td>
                    <td><span class="status-badge ${txn.approvalStatus === 'Approved' ? 'status-completed' : 'status-pending'}">${txn.approvalStatus || 'Pending Approval'}</span></td>
                    <td>${txn.paymentMade ? '✅ Paid' : '❌ Unpaid'}</td>
                    <td>
                        <button onclick="editTransaction('${txn.id}')" style="background:none; border:none; cursor:pointer;">✏️</button>
                        <button onclick="deleteTransaction('${txn.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </td>
                </tr>
            `).join('');

            updateStats();
        }

        function updateStats() {
            const total = transactions.length;
            const pendingCount = transactions.filter(t => !t.paymentMade).length;
            const paidCount = transactions.filter(t => t.paymentMade).length;
            const totalSpend = transactions.reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-pending').textContent = pendingCount;
            document.getElementById('stat-paid').textContent = paidCount;
            document.getElementById('stat-amount').textContent = '$' + totalSpend.toLocaleString();
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            updateTable();
        }

        function showAddModal() {
            document.getElementById('transaction-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-title').textContent = 'New Transaction';
            showModal('transaction-modal');
        }

        function saveTransaction() {
            const id = document.getElementById('edit-id').value || 'TXN-' + Date.now();
            const data = {
                id,
                details: document.getElementById('details').value,
                supplier: document.getElementById('supplier').value,
                amount: document.getElementById('amount').value,
                rfqDate: document.getElementById('rfq-date').value,
                closeDate: document.getElementById('close-date').value,
                approvalStatus: document.getElementById('approval-status').value,
                mtbNumber: document.getElementById('mtb-number').value,
                paymentMade: document.getElementById('payment-made').value === 'true'
            };

            const idx = transactions.findIndex(t => t.id === id);
            if (idx > -1) transactions[idx] = data; else transactions.unshift(data);

            saveToLocalStorage();
            updateTable();
            closeModal('transaction-modal');
            showToast('Saved Successfully');
        }

        function editTransaction(id) {
            const txn = transactions.find(t => t.id === id);
            document.getElementById('edit-id').value = txn.id;
            document.getElementById('details').value = txn.details;
            document.getElementById('supplier').value = txn.supplier;
            document.getElementById('amount').value = txn.amount;
            document.getElementById('rfq-date').value = txn.rfqDate;
            document.getElementById('close-date').value = txn.closeDate;
            document.getElementById('approval-status').value = txn.approvalStatus || 'Pending Approval';
            document.getElementById('mtb-number').value = txn.mtbNumber;
            document.getElementById('payment-made').value = txn.paymentMade.toString();
            document.getElementById('modal-title').textContent = 'Edit Transaction';
            showModal('transaction-modal');
        }

        function deleteTransaction(id) { if (confirm('Delete?')) { transactions = transactions.filter(t => t.id !== id); saveToLocalStorage(); updateTable(); } }
        function showModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showImportModal() { showModal('import-modal'); }
        function clearFilters() { document.getElementById('filter-status').value = ''; document.getElementById('filter-payment').value = ''; updateTable(); }
        function showToast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.getElementById('toast-container').appendChild(t); setTimeout(() => t.remove(), 3000); }
        
        function handleFileSelect(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const wb = XLSX.read(new Uint8Array(event.target.result), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                const mapped = json.map(r => ({
                    id: 'TXN-' + Math.random().toString(36).substr(2, 5),
                    details: r['Details'] || '',
                    supplier: r['Supplier'] || '',
                    amount: r['Amount'] || 0,
                    rfqDate: r['Date of RFQ'] || '',
                    closeDate: r['Close of RFQ'] || '',
                    approvalStatus: r['Approved'] ? 'Approved' : 'Pending Approval',
                    paymentMade: r['Payment Made'] === 'True' || r['Paid'] === 'paid'
                }));
                transactions = [...mapped, ...transactions];
                saveToLocalStorage(); updateTable(); closeModal('import-modal');
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        }
    </script>
</body>
</html>
